    <!-- top beam -->
    <line x1="48" y1="86" x2="208" y2="86"/>
    <!-- second beam -->
    <line x1="64" y1="106" x2="192" y2="106"/>
    <!-- left post -->
    <line x1="88" y1="86" x2="80" y2="206"/>
    <!-- right post -->
    <line x1="168" y1="86" x2="176" y2="206"/>
  </g>

  <!-- open book beneath -->
  <g fill="#f5f1e8">
    <path d="M40 190 Q90 178 122 192 L122 216 Q90 202 40 214 Z"/>
    <path d="M216 190 Q166 178 134 192 L134 216 Q166 202 216 214 Z"/>
  </g>
  <line x1="128" y1="190" x2="128" y2="216" stroke="#0f3460" stroke-width="3"/>
</svg>
