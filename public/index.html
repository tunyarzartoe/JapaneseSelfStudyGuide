<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Japanese Self-Study Guide | 学習ガイド</title>
    <meta name="description" content="Learn Japanese at your own pace: hiragana, katakana, vocabulary, grammar, kanji quizzes, JLPT-style exams and listening practice." />
    <meta name="keywords" content="Japanese, JLPT, hiragana, katakana, kanji, vocabulary, grammar, listening, self-study" />
    <meta name="author" content="yarzar.dev" />

    <!-- Theme color follows light/dark to match the navbar -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />

    <!-- Apply saved theme before first paint (no light flash). Same key as AppContext: "darkMode" -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('darkMode');
          var dark = saved !== null
            ? saved === 'true'
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var t = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-bs-theme', t);
        } catch (e) {}
      })();
    </script>

    <!-- Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="256x256" href="%PUBLIC_URL%/favicon-256.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Bootstrap JS: the bundle already includes Popper, so this is the only script needed.
         (Loading popper.min.js + bootstrap.min.js as well registers every dropdown twice,
         which can make the profile menu open and instantly close.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>

    </body>
